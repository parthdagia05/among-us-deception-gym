[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "among-us-deception-gym"
version = "0.1.0"
description = "RL environment for training LLMs to detect deception in Among Us"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
